<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zava Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --lc-blue: #1F4FFF;
    --lc-blue-deep: #0A2BCC;
    --lc-blue-glow: #4D72FF;
    --accent: #00E5FF;
    --ink: #0B1020;
    --ink-2: #1A2238;
    --frost: rgba(255, 255, 255, 0.08);
    --frost-2: rgba(255, 255, 255, 0.05);
    --frost-stroke: rgba(255, 255, 255, 0.18);
    --text: #EAF0FF;
    --text-dim: rgba(234, 240, 255, 0.65);
    --bubble-user: linear-gradient(135deg, var(--lc-blue) 0%, var(--lc-blue-glow) 100%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: var(--ink);
    overflow: hidden;
  }
  body::before, body::after {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(31,79,255,0.45), transparent 50%),
      radial-gradient(ellipse at 80% 30%, rgba(77,114,255,0.30), transparent 55%),
      radial-gradient(ellipse at 50% 90%, rgba(10,43,204,0.40), transparent 50%),
      var(--ink);
    animation: drift 24s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-3%, -2%) scale(1.05); }
  }

  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; max-width: 880px; margin: 0 auto; padding: 24px 16px; gap: 16px; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 20px;
    background: var(--frost); border: 1px solid var(--frost-stroke); border-radius: 18px;
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
  }
  header .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  header .logo {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--lc-blue), var(--lc-blue-glow));
    box-shadow: 0 4px 16px rgba(31,79,255,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  header .title { line-height: 1; }
  header .title small { display: block; color: var(--text-dim); font-weight: 500; font-size: 11px; margin-top: 2px; }
  header .step-indicator {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    background: var(--frost-2); border: 1px solid var(--frost-stroke); border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--accent);
  }
  header .step-indicator::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
  }
  header .step-indicator.muted { color: var(--text-dim); }
  header .step-indicator.muted::before { background: var(--text-dim); box-shadow: none; }

  .thread {
    overflow-y: auto; padding: 8px 4px 8px 4px; scroll-behavior: smooth;
    display: flex; flex-direction: column; gap: 12px;
  }
  .thread::-webkit-scrollbar { width: 8px; }
  .thread::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  .bubble {
    max-width: 80%; padding: 12px 16px; border-radius: 16px; line-height: 1.55; font-size: 14.5px;
    white-space: pre-wrap; word-wrap: break-word;
    backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .bubble.user { align-self: flex-end; background: var(--bubble-user); border: 1px solid rgba(255,255,255,0.25); color: white; }
  .bubble.assistant { align-self: flex-start; background: var(--frost); border: 1px solid var(--frost-stroke); }
  .bubble.assistant .text { white-space: normal; }
  .bubble.assistant .text > *:first-child { margin-top: 0; }
  .bubble.assistant .text > *:last-child { margin-bottom: 0; }
  .bubble.assistant .text p { margin: 0 0 8px 0; }
  .bubble.assistant .text ul, .bubble.assistant .text ol { margin: 4px 0 8px 0; padding-left: 22px; }
  .bubble.assistant .text li { margin: 2px 0; }
  .bubble.assistant .text strong { color: #fff; }
  .bubble.assistant .text code {
    background: rgba(0,0,0,0.35); padding: 1px 6px; border-radius: 5px;
    font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px;
  }
  .bubble.assistant .text a { color: var(--accent); }

  /* Inline citation pill that replaces "[doc-id]" inside rendered text. */
  .cite-link {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 6px; margin: 0 2px;
    background: rgba(0,229,255,0.14); border: 1px solid rgba(0,229,255,0.4);
    border-radius: 9px;
    color: var(--accent); font-size: 10.5px; font-weight: 700;
    font-family: ui-monospace, SFMono-Regular, monospace;
    text-decoration: none; line-height: 1;
    cursor: pointer; vertical-align: baseline;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .cite-link:hover { background: rgba(0,229,255,0.28); transform: translateY(-1px); }
  .cite-link.unknown { opacity: 0.55; cursor: default; }

  /* Hover card anchored to the bubble. */
  .cite-card {
    position: absolute; z-index: 30;
    max-width: 320px; padding: 10px 12px;
    background: rgba(11, 16, 32, 0.97); border: 1px solid var(--frost-stroke);
    border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    font-size: 12.5px; line-height: 1.45; color: var(--text);
    pointer-events: none; opacity: 0; transform: translateY(4px);
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  .cite-card.visible { opacity: 1; transform: translateY(0); }
  .cite-card .doc-id {
    font-family: ui-monospace, monospace; font-size: 10.5px;
    color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .cite-card .title { font-weight: 600; margin-bottom: 4px; }
  .cite-card .snippet { color: var(--text-dim); }

  .activity {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 8px; padding: 6px 12px;
    background: rgba(31,79,255,0.12); border: 1px solid rgba(77,114,255,0.3); border-radius: 999px;
    font-size: 12px; color: var(--text-dim);
  }
  .activity .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--lc-blue-glow);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50%      { opacity: 1;    transform: scale(1.15); }
  }

  .citation-row { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .citation {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; font-size: 11px;
    background: rgba(0,229,255,0.10); border: 1px solid rgba(0,229,255,0.3); border-radius: 6px;
    color: var(--accent);
  }
  .citation::before { content: "📎"; font-size: 10px; }

  .composer {
    padding: 12px;
    background: var(--frost); border: 1px solid var(--frost-stroke); border-radius: 18px;
    backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .first-suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .suggestion {
    padding: 6px 12px; font-size: 13px; cursor: pointer;
    background: var(--frost-2); border: 1px solid var(--frost-stroke); border-radius: 999px;
    color: var(--text); transition: all 0.15s ease;
  }
  .suggestion:hover { background: rgba(31,79,255,0.25); border-color: var(--lc-blue-glow); }
  .composer .row { display: flex; align-items: flex-end; gap: 8px; }
  .composer textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 160px;
    font-family: inherit; font-size: 14.5px; line-height: 1.5; color: var(--text);
    background: transparent; border: none; outline: none; padding: 8px;
  }
  .composer textarea::placeholder { color: var(--text-dim); }
  .composer button {
    appearance: none; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--lc-blue) 0%, var(--lc-blue-glow) 100%);
    color: white; font-weight: 600; font-family: inherit; font-size: 14px;
    padding: 10px 18px; border-radius: 12px;
    box-shadow: 0 4px 18px rgba(31,79,255,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.1s ease, box-shadow 0.15s ease;
  }
  .composer button:hover { box-shadow: 0 6px 22px rgba(31,79,255,0.6), inset 0 1px 0 rgba(255,255,255,0.3); }
  .composer button:active { transform: translateY(1px); }
  .composer button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---- Debug drawer ---- */
  .debug-toggle {
    position: fixed; left: 16px; bottom: 16px; z-index: 50;
    width: 44px; height: 44px; border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    background: var(--frost-2); border: 1px solid var(--frost-stroke);
    color: var(--text); cursor: pointer; font-size: 20px;
    backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%);
    box-shadow: 0 6px 22px rgba(0,0,0,0.3);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .debug-toggle:hover { background: rgba(31,79,255,0.18); transform: translateY(-1px); }
  .debug-toggle .badge {
    position: absolute; top: -4px; right: -4px;
    min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; background: var(--lc-blue);
    font-size: 10px; font-weight: 700; color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .debug-drawer {
    position: fixed; left: 16px; bottom: 70px; z-index: 49;
    width: min(440px, calc(100vw - 32px)); max-height: 60vh;
    display: flex; flex-direction: column;
    background: rgba(11, 16, 32, 0.85); border: 1px solid var(--frost-stroke);
    border-radius: 14px; overflow: hidden;
    backdrop-filter: blur(28px) saturate(140%); -webkit-backdrop-filter: blur(28px) saturate(140%);
    box-shadow: 0 16px 48px rgba(0,0,0,0.4);
    transform: translateY(8px); opacity: 0; pointer-events: none;
    transition: transform 0.18s ease, opacity 0.18s ease;
  }
  .debug-drawer.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .debug-drawer header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: rgba(31,79,255,0.12);
    border-bottom: 1px solid var(--frost-stroke);
    font-size: 13px; font-weight: 600; letter-spacing: 0.4px;
    border-radius: 0;
  }
  .debug-drawer header button {
    background: transparent; border: none; color: var(--text-dim);
    font-size: 12px; cursor: pointer; padding: 4px 8px; border-radius: 6px;
  }
  .debug-drawer header button:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  .debug-log {
    flex: 1; overflow-y: auto; padding: 8px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; line-height: 1.45;
  }
  .debug-log::-webkit-scrollbar { width: 6px; }
  .debug-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  .dbg-turn {
    border-top: 1px dashed rgba(255,255,255,0.1); padding: 8px 0;
  }
  .dbg-turn:first-child { border-top: none; }
  .dbg-turn-head {
    color: var(--accent); font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
  }
  .dbg-event { display: block; padding: 2px 0; color: var(--text); }
  .dbg-event .k { color: var(--lc-blue-glow); margin-right: 6px; }
  .dbg-event.tool .k { color: #FFB86B; }
  .dbg-event.step .k { color: var(--accent); }
  .dbg-event.citation .k { color: #B89BFF; }
  .dbg-event.error .k { color: #FF6B6B; }
  .dbg-empty { color: var(--text-dim); padding: 16px; text-align: center; font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo"></div>
      <div class="title">Zava Sales<small>LangChain v1 handoffs · Azure OpenAI · MCP</small></div>
    </div>
    <div class="step-indicator muted" id="step-indicator">step: greet</div>
  </header>

  <div class="thread" id="thread"></div>

  <div class="composer">
    <div class="first-suggestions" id="first-suggestions">
      <div class="suggestion" data-text="Hi — I run a 25-person property management company. Do you work with teams like mine?">I run a 25-person property management company</div>
      <div class="suggestion" data-text="What's the difference between Pro and Enterprise?">What's the difference between Pro and Enterprise?</div>
      <div class="suggestion" data-text="We're already on Big-Box Pro. Why would we switch?">We're already on a competitor — why switch?</div>
      <div class="suggestion" data-text="Can I see pricing and book a call?">See pricing and book a call</div>
    </div>
    <div class="row">
      <textarea id="composer-input" placeholder="Tell us about your business, ask about pricing, or request a demo…" rows="1"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>
</div>

<button class="debug-toggle" id="debug-toggle" aria-label="Toggle debug panel" title="Debug">
  🐛<span class="badge" id="debug-badge" style="display:none">0</span>
</button>
<div class="cite-card" id="cite-card" role="tooltip" aria-hidden="true">
  <div class="doc-id"></div>
  <div class="title"></div>
  <div class="snippet"></div>
</div>
<div class="debug-drawer" id="debug-drawer" role="region" aria-label="Agent debug panel">
  <header>
    <span>Agent debug</span>
    <button id="debug-clear">Clear</button>
  </header>
  <div class="debug-log" id="debug-log">
    <div class="dbg-empty">Send a message to see agent activity.</div>
  </div>
</div>

<script>
  const thread = document.getElementById("thread");
  const input = document.getElementById("composer-input");
  const sendBtn = document.getElementById("send-btn");
  const stepIndicator = document.getElementById("step-indicator");
  const firstSuggestions = document.getElementById("first-suggestions");
  const debugToggle = document.getElementById("debug-toggle");
  const debugDrawer = document.getElementById("debug-drawer");
  const debugLog = document.getElementById("debug-log");
  const debugBadge = document.getElementById("debug-badge");
  const debugClear = document.getElementById("debug-clear");
  const citeCard = document.getElementById("cite-card");

  // doc_id -> {title, snippet}. Populated as citation events arrive on the wire,
  // and consulted whenever we replace inline [doc-id] text with a clickable pill.
  const citationStore = new Map();

  const STEP_LABELS = {
    greet: "greet (concierge)",
    qualify: "qualify (BANT)",
    educate: "educate",
    objection: "handle objection",
    book: "propose meeting",
    handoff_to_ae: "handoff to AE",
  };

  const TOOL_LABELS = {
    set_intent: "Routing…",
    lookup_lead_by_email: "Looking up your account…",
    update_lead_profile: "Saving your details…",
    advance_to_step: "Moving along the funnel…",
    log_objection: "Noting your concern…",
    propose_meeting_times: "Drafting meeting times…",
    create_handoff_summary: "Preparing AE handoff…",
    log_activity: "Logging activity…",
    escalate_to_ae: "Bringing in an account exec…",
    semantic_search_products: "Searching the Zava catalog…",
    get_product_details: "Looking up product details…",
    search_case_studies: "Pulling up customer stories…",
    search_kb_articles: "Reading the Zava knowledge base…",
    get_pricing: "Fetching plan pricing…",
    compare_plans: "Comparing plans…",
    get_table_schemas: "Inspecting database schema…",
    execute_sales_query: "Running a database query…",
    get_current_utc_date: "Checking the date…",
  };

  function toolLabel(name) {
    return TOOL_LABELS[name] || `Calling ${name}…`;
  }

  function renderMarkdown(text) {
    if (!window.marked || !window.DOMPurify) return text;
    const raw = window.marked.parse(text, { breaks: true, gfm: true });
    const sanitized = window.DOMPurify.sanitize(raw);
    return linkifyCitations(sanitized);
  }

  // Replace plain-text "[doc-id]" inside the rendered HTML with a clickable
  // <a class="cite-link" data-doc-id="..."> pill. Skips occurrences that are
  // already inside an <a>/<code> element to avoid double-wrapping.
  function linkifyCitations(html) {
    return html.replace(/\[([a-zA-Z0-9_\-]+)\]/g, (full, docId) => {
      // Heuristic — only linkify if it looks like one of our doc-id schemes
      // (contains a dash, e.g. case-3, doc-12, plan-2). Avoids touching
      // generic Markdown link text.
      if (!/-/.test(docId)) return full;
      const known = citationStore.has(docId);
      const cls = known ? "cite-link" : "cite-link unknown";
      return `<a href="#" class="${cls}" data-doc-id="${docId}">${docId}</a>`;
    });
  }

  function showCiteCard(anchor, docId) {
    const data = citationStore.get(docId);
    if (!data) {
      citeCard.classList.remove("visible");
      return;
    }
    citeCard.querySelector(".doc-id").textContent = docId;
    citeCard.querySelector(".title").textContent = data.title || "";
    citeCard.querySelector(".snippet").textContent = data.snippet || "";
    const r = anchor.getBoundingClientRect();
    const cardWidth = 320;
    const left = Math.max(8, Math.min(window.innerWidth - cardWidth - 8, r.left));
    const top = r.bottom + 6;
    citeCard.style.left = left + "px";
    citeCard.style.top = top + "px";
    citeCard.classList.add("visible");
  }
  function hideCiteCard() { citeCard.classList.remove("visible"); }

  // Delegated hover/click for inline citation pills inside any assistant bubble.
  document.addEventListener("mouseover", (e) => {
    const a = e.target.closest(".cite-link");
    if (a && !a.classList.contains("unknown")) showCiteCard(a, a.dataset.docId);
  });
  document.addEventListener("mouseout", (e) => {
    if (e.target.closest(".cite-link")) hideCiteCard();
  });
  document.addEventListener("click", (e) => {
    const a = e.target.closest(".cite-link");
    if (a) {
      e.preventDefault();
      if (!a.classList.contains("unknown")) showCiteCard(a, a.dataset.docId);
    }
  });

  let history = [];
  let threadId = null;
  let debugCount = 0;
  let currentDebugTurn = null;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function ts() {
    const d = new Date();
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3, "0")}`;
  }

  function startDebugTurn(userText) {
    if (debugLog.querySelector(".dbg-empty")) debugLog.innerHTML = "";
    const turn = el("div", "dbg-turn");
    const head = el("div", "dbg-turn-head", `[${ts()}] user: ${userText.slice(0, 60)}${userText.length > 60 ? "…" : ""}`);
    turn.appendChild(head);
    debugLog.appendChild(turn);
    debugLog.scrollTop = debugLog.scrollHeight;
    currentDebugTurn = turn;
  }

  function pushDebug(kind, label, detail) {
    if (!currentDebugTurn) return;
    const line = el("div", `dbg-event ${kind}`);
    const k = el("span", "k", `[${ts()}] ${label}`);
    line.appendChild(k);
    if (detail) {
      const v = document.createElement("span");
      v.textContent = detail;
      line.appendChild(v);
    }
    currentDebugTurn.appendChild(line);
    debugLog.scrollTop = debugLog.scrollHeight;
    debugCount++;
    if (!debugDrawer.classList.contains("open")) {
      debugBadge.style.display = "";
      debugBadge.textContent = String(debugCount);
    }
  }

  debugToggle.addEventListener("click", () => {
    debugDrawer.classList.toggle("open");
    if (debugDrawer.classList.contains("open")) {
      debugBadge.style.display = "none";
      debugCount = 0;
    }
  });
  debugClear.addEventListener("click", () => {
    debugLog.innerHTML = '<div class="dbg-empty">Send a message to see agent activity.</div>';
    currentDebugTurn = null;
    debugCount = 0; debugBadge.style.display = "none";
  });

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function setStep(step) {
    if (!step) return;
    stepIndicator.classList.remove("muted");
    stepIndicator.textContent = `step: ${step}`;
  }

  function addBubble(role) {
    const wrap = el("div", "bubble " + role);
    if (role === "assistant") {
      wrap.appendChild(el("div", "text"));
    }
    thread.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
    return wrap;
  }

  function addUser(text) {
    const b = addBubble("user");
    b.textContent = text;
  }

  function showWelcome() {
    const bubble = addBubble("assistant");
    const textNode = bubble.querySelector(".text");
    const md = `👋 **Welcome to Zava** — your DIY supplies partner for Washington-state pros and homeowners.

I'm Zava's sales concierge. I can help you:

- **Compare plans & pricing** (Starter, Pro, Enterprise)
- **See customer stories** from teams like yours
- **Answer questions** about bulk pricing, same-day delivery, and onboarding
- **Book a call** with an account exec when you're ready

What brings you to Zava today?`;
    textNode.innerHTML = renderMarkdown(md);
  }

  async function send(text) {
    if (!text.trim()) return;
    firstSuggestions.style.display = "none";
    addUser(text);
    history.push({ role: "user", content: text });
    input.value = "";
    sendBtn.disabled = true;
    startDebugTurn(text);

    const bubble = addBubble("assistant");
    const textNode = bubble.querySelector(".text");
    const turnCitations = new Set();
    let activityChip = null;

    function setActivity(label) {
      if (!activityChip) {
        activityChip = el("div", "activity");
        activityChip.appendChild(el("span", "dot"));
        activityChip.appendChild(el("span", "label"));
        bubble.appendChild(activityChip);
      }
      activityChip.querySelector(".label").textContent = label;
      thread.scrollTop = thread.scrollHeight;
    }
    function clearActivity() {
      if (activityChip) {
        activityChip.remove();
        activityChip = null;
      }
    }

    setActivity("Thinking…");

    let assistantText = "";

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          history: history.slice(0, -1),
          thread_id: threadId,
        }),
      });
      if (!res.ok) {
        textNode.textContent = `Error: ${res.status}`;
        return;
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 1);
          if (!line) continue;
          let ev;
          try { ev = JSON.parse(line); } catch { continue; }

          if (ev.thread_id) threadId = ev.thread_id;
          if (ev.step) {
            setStep(ev.step);
            pushDebug("step", "step →", STEP_LABELS[ev.step] || ev.step);
          }
          if (ev.chunk) {
            assistantText += ev.chunk;
            clearActivity();
            textNode.innerHTML = renderMarkdown(assistantText);
          }
          if (ev.tool) {
            setActivity(toolLabel(ev.tool.name));
            pushDebug("tool", `tool ${ev.tool.name}(`, `${ev.tool.args_preview || ""})`);
          }
          if (ev.citation && ev.citation.doc_id) {
            const docId = ev.citation.doc_id;
            // Always store; later events for the same doc-id can fill in title/snippet.
            const prev = citationStore.get(docId) || {};
            citationStore.set(docId, {
              title: ev.citation.title || prev.title || "",
              snippet: ev.citation.snippet || prev.snippet || "",
            });
            if (!turnCitations.has(docId)) {
              turnCitations.add(docId);
              pushDebug("citation", "cite", docId + (ev.citation.title ? `  — ${ev.citation.title}` : ""));
            }
            // Re-render so any "unknown" pills already in this bubble upgrade
            // to clickable. Cheap because the bubble's text is small.
            if (assistantText) textNode.innerHTML = renderMarkdown(assistantText);
          }
          if (ev.error) {
            textNode.textContent = `Error: ${ev.error}`;
            pushDebug("error", "error:", ev.error);
          }
          thread.scrollTop = thread.scrollHeight;
        }
      }
    } catch (err) {
      textNode.textContent = `Error: ${err.message}`;
      pushDebug("error", "fetch error:", err.message);
    } finally {
      clearActivity();
      sendBtn.disabled = false;
    }

    history.push({ role: "assistant", content: assistantText });
  }

  sendBtn.addEventListener("click", () => send(input.value));
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send(input.value);
    }
  });
  firstSuggestions.querySelectorAll(".suggestion").forEach(s => {
    s.addEventListener("click", () => send(s.dataset.text));
  });

  showWelcome();
</script>
</body>
</html>
