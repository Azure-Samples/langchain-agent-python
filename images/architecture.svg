  <text x="1275" y="468" font-size="13" fill="#1e3a8a" font-weight="600">SQL  +  vector search</text>

  <!-- Footer -->
  <text x="800" y="985" text-anchor="middle" font-size="14" fill="#64748b">Provisioned with  azd up   ·   Bicep  ·   one-command deploy</text>
