  <text x="1485" y="748" text-anchor="end" font-size="13" fill="#64748b">m = 16,  ef = 64</text>

  <!-- ============== Bottom support strip ============== -->
  <rect x="450" y="830" width="1080" height="100" rx="16" ry="16" fill="#f6f9ff" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="470" y="858" font-size="14" font-weight="600" fill="#1e3a8a" letter-spacing="1.5">PLATFORM SERVICES</text>

  <image href="icons/acr.svg" x="475" y="870" width="36" height="36"/>
  <text x="520" y="893" font-size="16" font-weight="600" fill="#1e3a8a">Container Registry</text>
  <text x="520" y="912" font-size="13" fill="#64748b">cruefkzvrhdascm</text>

  <image href="icons/managed-identity.svg" x="820" y="870" width="36" height="36"/>
  <text x="865" y="893" font-size="16" font-weight="600" fill="#1e3a8a">Managed Identity</text>
