  <rect x="480" y="715" width="465" height="58" rx="10" ry="10" fill="#ffffff" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="500" y="743" font-size="17" font-weight="600" fill="#1e3a8a">text-embedding-3-small</text>
  <text x="930" y="748" text-anchor="end" font-size="13" fill="#64748b">vectors</text>

