  <text x="500" y="395" font-size="14" fill="#1e3a8a" font-weight="600">LangChain v1  ·  create_agent</text>
  <text x="500" y="416" font-size="13" fill="#64748b">4 middleware  ·  InMemorySaver checkpointer</text>

