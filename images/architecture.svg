  <circle cx="115" cy="490" r="20" fill="#a5d8ff" stroke="#1e3a8a" stroke-width="2"/>
  <path d="M85 540 Q115 510 145 540 L145 555 L85 555 Z" fill="#a5d8ff" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round"/>
  <text x="170" y="490" font-size="24" font-weight="600" fill="#1e3a8a">User</text>
  <text x="170" y="520" font-size="16" fill="#475569">Browser  ·  streaming UI</text>
  <text x="170" y="545" font-size="14" fill="#64748b">Starlette + NDJSON</text>

