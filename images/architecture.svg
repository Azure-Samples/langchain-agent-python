<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Helvetica, Arial, sans-serif">

  <!-- Background -->
  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="62" text-anchor="middle" font-size="38" font-weight="700" fill="#1e3a8a">Zava Sales Agent  ·  Architecture</text>
  <text x="800" y="100" text-anchor="middle" font-size="20" fill="#475569">LangChain v1  +  MCP  +  Azure OpenAI  +  PostgreSQL with pgvector</text>

  <!-- ============== USER (left) ============== -->
  <rect x="40" y="430" width="300" height="160" rx="16" ry="16" fill="#ffffff" stroke="#4a9eed" stroke-width="2"/>
