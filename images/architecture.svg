  <text x="1285" y="912" font-size="13" fill="#64748b">tracing  ·  metrics  ·  logs</text>

  <!-- ============== Cross-zone arrows ============== -->
  <!-- Agent -> Azure OpenAI (chat) -->
  <line x1="700" y1="435" x2="700" y2="490" stroke="#4a9eed" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="700,490 694,478 706,478" fill="#4a9eed"/>
  <text x="710" y="468" font-size="13" fill="#1e3a8a" font-weight="600">chat + utility</text>

  <!-- MCP -> Azure OpenAI (embeddings) curve -->
  <path d="M 1140 435 C 1140 470, 980 470, 945 490" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <polygon points="945,490 957,486 951,476" fill="#06b6d4"/>
  <text x="1020" y="478" font-size="13" fill="#0e7490" font-weight="600">embed</text>

