  <text x="1485" y="678" text-anchor="end" font-size="13" fill="#64748b">deployment + query</text>

  <rect x="1035" y="715" width="465" height="58" rx="10" ry="10" fill="#ffffff" stroke="#4a9eed" stroke-width="1.5"/>
