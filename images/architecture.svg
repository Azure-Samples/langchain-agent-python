  <text x="1485" y="608" text-anchor="end" font-size="13" fill="#64748b">relational</text>

  <rect x="1035" y="645" width="465" height="58" rx="10" ry="10" fill="#ffffff" stroke="#4a9eed" stroke-width="1.5"/>
